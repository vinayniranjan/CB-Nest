<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .title { font-size: 22px; font-weight: 700; fill: #0f172a; }
      .layer { font-size: 12px; font-weight: 700; fill: #64748b; letter-spacing: 1.5px; }
      .h { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .t { font-size: 12.5px; fill: #334155; }
      .s { font-size: 11.5px; fill: #64748b; }
      .lbl { font-size: 11.5px; fill: #475569; font-weight: 600; }
      .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.4; }
      .ui { fill: #eef2ff; stroke: #818cf8; }
      .api { fill: #f0f9ff; stroke: #38bdf8; }
      .ai { fill: #f5f3ff; stroke: #a78bfa; }
      .guard { fill: #fef2f2; stroke: #f87171; }
      .data { fill: #f0fdf4; stroke: #4ade80; }
      .ext { fill: #fffbeb; stroke: #f59e0b; }
      .line { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #b45309; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrowAmber); }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="900" fill="#f8fafc"/>
  <text x="40" y="44" class="title">NovaWorks PeopleOps Copilot — architecture</text>
  <text x="40" y="66" class="s">AI features inside CB Nest. Identity and role come from the JWT; agents never write the database directly.</text>

  <!-- Frontend -->
  <text x="40" y="104" class="layer">FRONTEND · NEXT.JS</text>
  <rect x="40" y="112" width="1120" height="74" rx="12" class="box ui"/>
  <text x="62" y="140" class="h">/ai-copilot</text>
  <text x="62" y="162" class="t">Ask Anything · Ask HR Policy · People &amp; Projects · Automate HR Task · Recent AI Actions · role mode badge</text>
  <text x="760" y="140" class="h">components/ai/*</text>
  <text x="760" y="162" class="t">chat panel · sources · SQL table · action card (Confirm / Cancel)</text>

  <path d="M600 186 L600 222" class="line"/>
  <text x="612" y="210" class="lbl">HTTPS · Authorization: Bearer &lt;user JWT&gt;</text>

  <!-- API -->
  <text x="40" y="244" class="layer">BACKEND · FASTAPI</text>
  <rect x="40" y="252" width="1120" height="86" rx="12" class="box api"/>
  <text x="62" y="280" class="h">chat.py endpoints</text>
  <text x="62" y="302" class="t">POST /chat/router · /policy · /sql · /actions</text>
  <text x="62" y="322" class="t">GET /chat/capabilities · /audit · /audit/stats · POST /policy/reindex</text>
  <text x="560" y="280" class="h">get_user_context</text>
  <text x="560" y="302" class="t">verify JWT → load employee &amp; role from DB</text>
  <text x="560" y="322" class="t">per-user rate limit · 2000-char cap · validation</text>
  <text x="900" y="280" class="h">Existing HRMS REST API</text>
  <text x="900" y="302" class="t">/leaves · /tickets · /announcements</text>
  <text x="900" y="322" class="t">/employees/{id}/projects · role checks</text>

  <path d="M380 338 L380 374" class="line"/>

  <!-- Orchestrator -->
  <text x="40" y="396" class="layer">AI ORCHESTRATION</text>
  <rect x="40" y="404" width="680" height="78" rx="12" class="box ai"/>
  <text x="62" y="432" class="h">orchestrator.py</text>
  <text x="62" y="454" class="t">1 deterministic guards: prompt injection · raw / destructive SQL</text>
  <text x="62" y="472" class="t">2 classify intent (Claude structured output → rules)  3 dispatch  4 audit log</text>

  <rect x="760" y="404" width="300" height="78" rx="12" class="box ext"/>
  <text x="782" y="432" class="h">Claude API (claude-opus-5-5)</text>
  <text x="782" y="454" class="t">JSON-schema structured outputs only</text>
  <text x="782" y="472" class="s">optional · any failure → rule-based engine</text>
  <path d="M720 443 L758 443" class="dash"/>

  <!-- Agents -->
  <path d="M170 482 L170 526" class="line"/>
  <path d="M380 482 L380 526" class="line"/>
  <path d="M590 482 L590 526" class="line"/>
  <text x="40" y="520" class="layer">AGENTS</text>
  <rect x="40" y="528" width="260" height="96" rx="12" class="box ai"/>
  <text x="58" y="556" class="h">Policy RAG</text>
  <text x="58" y="577" class="t">retrieve → (rewrite if weak)</text>
  <text x="58" y="595" class="t">→ grounded answer + sources</text>
  <text x="58" y="613" class="s">policy_rag.py</text>

  <rect x="320" y="528" width="260" height="96" rx="12" class="box ai"/>
  <text x="338" y="556" class="h">SQL agent</text>
  <text x="338" y="577" class="t">NL → SELECT (Claude / rules)</text>
  <text x="338" y="595" class="t">→ guardrails → summary</text>
  <text x="338" y="613" class="s">sql_agent.py</text>

  <rect x="600" y="528" width="300" height="96" rx="12" class="box ai"/>
  <text x="618" y="556" class="h">HR action agent</text>
  <text x="618" y="577" class="t">extract tool + args → permission check</text>
  <text x="618" y="595" class="t">→ resolve names → confirm (HITL) → call</text>
  <text x="618" y="613" class="s">action_agent.py · permissions.py</text>

  <rect x="920" y="528" width="150" height="96" rx="12" class="box"/>
  <text x="936" y="556" class="h">Audit</text>
  <text x="936" y="577" class="t">every request</text>
  <text x="936" y="595" class="t">redacted · ids only</text>
  <text x="936" y="613" class="s">ai_audit_logs</text>

  <!-- Tools -->
  <path d="M170 624 L170 668" class="line"/>
  <path d="M450 624 L450 668" class="line"/>
  <path d="M750 624 L750 668" class="line"/>
  <text x="40" y="662" class="layer">TOOLS &amp; GUARDRAILS</text>
  <rect x="40" y="670" width="260" height="92" rx="12" class="box data"/>
  <text x="58" y="697" class="h">Vector store</text>
  <text x="58" y="718" class="t">ai_policy_chunks · cosine search</text>
  <text x="58" y="736" class="t">hashed embeddings (or fastembed)</text>
  <text x="58" y="752" class="s">auto re-index on policy change</text>

  <rect x="320" y="670" width="260" height="92" rx="12" class="box guard"/>
  <text x="338" y="697" class="h">SQL guardrails</text>
  <text x="338" y="718" class="t">keyword screen · sqlglot AST</text>
  <text x="338" y="736" class="t">role-scoped CTE shadowing · LIMIT</text>
  <text x="338" y="752" class="s">read-only conn + SQLite authorizer</text>

  <rect x="600" y="670" width="300" height="92" rx="12" class="box guard"/>
  <text x="618" y="697" class="h">Backend API tools</text>
  <text x="618" y="718" class="t">api_tools.py · httpx with the user's JWT</text>
  <text x="618" y="736" class="t">signed single-use confirmation tokens</text>
  <text x="618" y="752" class="s">no database session in the agent</text>

  <!-- API tools to HRMS REST API -->
  <path d="M900 716 L1100 716 L1100 340" class="line"/>
  <text x="922" y="706" class="lbl">user's token</text>

  <!-- Database -->
  <path d="M170 762 L170 806" class="line"/>
  <path d="M450 762 L450 806" class="line"/>
  <text x="472" y="790" class="lbl">SELECT only</text>
  <path d="M1140 338 L1140 806" class="line"/>
  <text x="1150" y="500" class="lbl" transform="rotate(90 1150 500)">service layer → writes</text>
  <path d="M995 624 L995 806" class="line"/>

  <rect x="40" y="808" width="1120" height="64" rx="12" class="box data"/>
  <text x="62" y="836" class="h">SQLite (existing HRMS database)</text>
  <text x="62" y="857" class="t">employees · departments · projects · employee_projects · skills · leave_* · tickets · announcements · payroll_records · hr_policies  +  ai_policy_chunks · ai_audit_logs</text>
</svg>
